// Escape user text before putting it in innerHTML (prevents HTML injection).
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

const KIP_OPENERS = ['', '', '', 'Good question. ', 'Happy to help with that. ', 'Sure thing. '];

const KIP_FALLBACKS = [
  "I don't have a good answer for that one. I'm strongest on Matthew's promotions, hardware rollouts, training results, and military background.",
  "That's outside what I know. Try asking about his metrics, leadership style, or experience.",
  "Not sure I can help with that. You can always email Matthew directly at " + EMAIL + "."
];

// Conversation state: remembers what Kip already said so he doesn't repeat himself.
const kipState = { lastIntent: null, lastOpener: '', used: {}, moreUsed: new Set(), fallbackCount: 0 };

// Pick a variant that hasn't been used yet; once all are used, reshuffle without immediately repeating the last one.
function pickFresh(key, options) {
  const used = kipState.used[key] || (kipState.used[key] = []);
  if (used.length >= options.length) {
    const last = used[used.length - 1];
    used.length = 0;
    if (options.length > 1) used.push(last);
  }
  const pool = options.map((_, i) => i).filter(i => !used.includes(i));
  const i = pool[Math.floor(Math.random() * pool.length)];
  used.push(i);
  return options[i];
}

function pickOpener() {
  const options = KIP_OPENERS.filter(o => o !== kipState.lastOpener || o === '');
  const opener = options[Math.floor(Math.random() * options.length)];
  kipState.lastOpener = opener;
  return opener;
}

function getKipResponse(rawQuery) {
  const q = rawQuery.toLowerCase().trim();

  // Follow-ups: "tell me more", "go on", etc.
  if (/^(more|tell me more|go on|elaborate|what else|expand)\b/.test(q) && kipState.lastIntent) {
    const intent = KIP_INTENTS.find(i => i.id === kipState.lastIntent);
    if (intent && intent.more && !kipState.moreUsed.has(intent.id)) {
      kipState.moreUsed.add(intent.id);
      return intent.more;
    }
    return "That's all the detail I have on that one. Try another topic, or email Matthew at " + EMAIL + ".";
  }

  // Score every intent; highest score wins (earlier intents win ties).
  let best = null, bestScore = 0;
  for (const intent of KIP_INTENTS) {
    const score = intent.patterns.reduce((n, p) => n + (p.test(q) ? 1 : 0), 0);
    if (score > bestScore) { best = intent; bestScore = score; }
  }

  if (!best) {
    kipState.fallbackCount++;
    return pickFresh('fallback', KIP_FALLBACKS);
  }

  kipState.fallbackCount = 0;
  kipState.lastIntent = best.id;
  const opener = best.id === 'greeting' ? '' : pickOpener();
  return opener + pickFresh(best.id, best.replies);
}
